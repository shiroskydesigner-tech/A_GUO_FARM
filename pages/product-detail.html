<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>商品詳情 - 阿國農場 A GUO FARM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/pages/product-list.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
</head>
<body>
  <div class="wrap">
    <header>
      <div class="header-brand">
        <a href="../index.html" class="brand">
          <div class="mark" aria-hidden="true"><img src="../images/logo/logo.svg" alt="阿國農場" /></div>
          <div class="name">
            <b>阿國農場</b>
            <small>A GUO FARM</small>
          </div>
        </a>
      </div>

      <nav>
        <button type="button" class="hamburger-btn" aria-label="開啟選單" aria-expanded="false" aria-controls="nav-overlay">
          <span></span><span></span><span></span>
        </button>
        <a href="about.html#method">了解我們怎麼採收</a>
        <a href="about.html#about">關於我們</a>
        <div class="nav-right">
          <a href="../index.html" class="home-link" aria-label="回首頁"><span aria-hidden="true">⌂</span></a>
          <a href="https://s.ccat.com.tw/18714" class="cart-link" target="_blank" rel="noopener" aria-label="前往訂購"><span aria-hidden="true">🛒</span></a>
        </div>
      </nav>
    </header>

    <div class="nav-overlay" id="nav-overlay" aria-hidden="true">
      <a href="about.html#method">了解我們怎麼採收</a>
      <a href="about.html#about">關於我們</a>
    </div>

    <main class="panel" id="product-detail-main">
      <div class="section" style="padding-top:40px;padding-bottom:40px">
        <div id="product-detail-content">
          <p style="text-align:center;color:var(--muted)">載入中…</p>
        </div>
      </div>

      <footer>
        <div>阿國農場 A GUO FARM</div>
        <div>© <span id="y"></span> All truth, no perfection.</div>
      </footer>
    </main>
  </div>

  <script src="../js/cart.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/products.js"></script>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var id = params.get("id");
      var container = document.getElementById("product-detail-content");
      if (!container || typeof PRODUCTS === "undefined") return;

      var p = PRODUCTS.find(function (x) { return x.id === id; });
      if (!p) {
        container.innerHTML = "<p style='text-align:center;color:var(--muted)'>找不到該商品。</p><div class='btns' style='margin-top:16px'><a class='btn' href='products.html'>返回商品列表</a></div>";
        return;
      }

      var thumb = p.image
        ? '<img src="../' + p.image + '" alt="" style="width:100%;max-width:320px;border-radius:var(--radius);overflow:hidden;border:1px solid var(--line)" />'
        : '<div class="fruit" style="width:200px;height:200px;margin:0 auto"></div>';
      var specs = (p.specs || []).map(function (s) { return '<span class="pill">' + s + '</span>'; }).join("");

      var actionHtml = p.goUrl
        ? '<a class="btn" id="detail-buy-now" href="' + p.goUrl + '" target="_blank" rel="noopener">立即訂購</a>'
        : '<button type="button" class="btn" id="detail-add-cart" data-id="' + p.id + '" data-name="' + (p.name || '').replace(/"/g, "&quot;") + '" data-price="' + p.price + '" data-image="' + (p.image || '').replace(/"/g, "&quot;") + '">加入購物袋</button>';

      container.innerHTML =
        '<div style="max-width:680px;margin:0 auto;text-align:center">' +
          '<div style="margin-bottom:24px">' + thumb + '</div>' +
          '<h1 style="margin:0 0 8px;font-family:var(--serif);font-size:28px;letter-spacing:1px;color:rgba(42,39,35,.88)">' + p.name + '</h1>' +
          '<p style="margin:0 0 16px;font-size:18px;color:var(--muted)">NT$ ' + p.price + ' / ' + p.unit + '</p>' +
          (p.description ? '<p style="margin:0 0 20px;text-align:left;line-height:1.8;color:rgba(110,98,89,.95)">' + p.description + '</p>' : '') +
          (specs ? '<div class="spec"><div class="row">' + specs + '</div></div>' : '') +
          '<div class="btns" style="margin-top:28px">' +
            actionHtml +
            '<a class="btn" href="products.html">返回列表</a>' +
          '</div>' +
        '</div>';

      var addCartBtn = document.getElementById("detail-add-cart");
      if (addCartBtn) {
        addCartBtn.addEventListener("click", function () {
          var btn = this;
          addToCart(btn.getAttribute("data-id"), btn.getAttribute("data-name"), btn.getAttribute("data-price"), btn.getAttribute("data-image"), 1);
          if (window.updateHeaderCartCount) updateHeaderCartCount();
        });
      }

      document.title = p.name + " - 阿國農場 A GUO FARM";
    })();
    if (window.updateHeaderCartCount) updateHeaderCartCount();
  </script>
</body>
</html>
